# Example settings. The CLI takes the same names as "--key value" options (see README.md).
# Nothing is hard-coded: copy these values onto the command line or into the scripts' environment variables.
host=127.0.0.1
tracker-host=127.0.0.1
tracker-port=6969
strategy=rarest-first        # rarest-first | random | sequential
piece-size-kb=64
upload-kbps=0                # 0 = unlimited (simulated bandwidth cap per peer)
unchoke-slots=2
optimistic-slots=1
round-ms=1000
socket-timeout-ms=15000
